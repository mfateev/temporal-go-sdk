name: Isolate integration bindings

on:
  push:
    branches: [task/modify-go-runtime-for-isolates]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.7'
          cache: false
      - name: Canonical quality and unit checks
        working-directory: internal/cmd/build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isolate-binding-logs"
          if ! go run . check > "$RUNNER_TEMP/isolate-binding-logs/check.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/isolate-binding-logs/check.log"
            exit 1
          fi
          if ! go run . unit-test -run TestWorkflowIntegration -log-dir "$RUNNER_TEMP/isolate-binding-logs/unit" > "$RUNNER_TEMP/isolate-binding-logs/unit.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/isolate-binding-logs/unit.log"
            exit 1
          fi
      - name: Workflow behavior with default and zero cache
        working-directory: internal/cmd/build
        shell: bash
        run: |
          set -euo pipefail
          for cache in default 0; do
            if [[ "$cache" == 0 ]]; then export WORKFLOW_CACHE_SIZE=0; else unset WORKFLOW_CACHE_SIZE; fi
            # The canonical runner persists this DB. Fixed workflow/reset IDs
            # from the previous mode must not survive into a new task queue.
            rm -f temporal.sqlite temporal.sqlite-shm temporal.sqlite-wal
            if ! go run . integration-test -dev-server -log-dir "$RUNNER_TEMP/isolate-binding-logs/integration-$cache" -run 'TestIntegrationSuite/(TestResetWorkflowExecutionWithChildren|TestChildWorkflowTypedSearchAttributes|TestWorkflowTypedSearchAttributes)$' > "$RUNNER_TEMP/isolate-binding-logs/integration-$cache.log" 2>&1; then
              tail -n 100 "$RUNNER_TEMP/isolate-binding-logs/integration-$cache.log"
              exit 1
            fi
          done
      - name: Preserve all output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolate-binding-logs
          path: |
            ${{ runner.temp }}/isolate-binding-logs
            .build/test-logs
